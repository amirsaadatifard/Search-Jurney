[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "search-journey-automation-platform"
version = "0.1.0"
description = "Automated search-journey simulation and controlled web interaction testing platform (university capstone project)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "structlog>=24.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "playwright>=1.44",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["templates/*.html"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py312"]
# Template folders contain only HTML; skipping them also keeps Black away from
# very deep paths on Windows.
extend-exclude = "/templates/"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "N802",   # Qt overrides use camelCase (e.g. closeEvent)
    "RUF012", # mutable class attributes are idiomatic for SQLAlchemy/Qt declarations
    "RUF001", # typographic characters (en dash, multiplication sign) are intended in UI text
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Embedded data (SVG path strings, Qt stylesheet) is clearer unwrapped.
"src/ui/icons.py" = ["E501"]
"src/ui/theme.py" = ["E501"]
"src/local_servers/target_site/content.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["playwright.*", "keyring.*", "pandas.*", "openpyxl.*", "matplotlib.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
qt_api = "pyside6"
markers = [
    "e2e: end-to-end tests that launch local servers and a real browser",
]
filterwarnings = ["ignore::DeprecationWarning"]
