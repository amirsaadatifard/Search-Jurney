# Used only by the `alembic` command line during development, e.g.
#   alembic revision --autogenerate -m "add column"
# The application itself migrates through src/database/migrator.py.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///data/sjat.db
